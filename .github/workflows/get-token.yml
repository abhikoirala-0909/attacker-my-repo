name: Get OIDC Token
on: [push, workflow_dispatch]
permissions:
  id-token: write
  contents: read
jobs:
  get-token:
    runs-on: ubuntu-latest
    steps:
      - name: Get Token
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://iam.googleapis.com/projects/8082357372/locations/global/workloadIdentityPools/test-pool/providers/github-provider" | jq -r '.value')
          echo "Here is your real token:"
          echo "----------------------------------------"
          echo "$TOKEN" | base64 -w 0
          echo "----------------------------------------"
